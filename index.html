<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أبو عمر فرن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf3e0;--ink:#2a1210;--red:#a3221b;--yellow:#f2c230;--card:#ffffff;--line:#e6d6b0;--muted:#6b4a3f;--wa:#1f9d55;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c0c0b;--ink:#fbeed0;--card:#2a1412;--line:#4a2a25;--muted:#d3b8a4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c0c0b;--ink:#fbeed0;--card:#2a1412;--line:#4a2a25;--muted:#d3b8a4;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:28px 20px 40px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:196px;height:196px;border-radius:50%;box-shadow:0 0 0 5px var(--yellow),0 10px 30px rgba(163,34,27,.35);animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.logo{animation:none}}
h1{font-size:2rem;font-weight:900;margin:22px 0 4px;color:var(--red)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1{color:var(--yellow)}}
p.sub{margin:0 0 26px;color:var(--muted);font-size:1.05rem}
.btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:16px;text-decoration:none;font-weight:700;font-size:1.1rem;margin-bottom:12px;color:var(--ink);background:var(--card);border:2px solid var(--line);text-align:right}
.btn small{display:block;font-weight:500;font-size:.85rem;color:var(--muted)}
.btn svg{width:30px;height:30px;flex:none}
.btn:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.btn:active{transform:scale(.98)}
.order{background:var(--wa);border-color:var(--wa);color:#fff;font-size:1.3rem;padding:20px 18px;box-shadow:0 8px 20px rgba(31,157,85,.35)}
.order small{color:#e8fff1}
.menu{background:var(--yellow);border-color:var(--yellow);color:#2a1210}
.menu small{color:#5a3a1a}
h2{font-size:1rem;margin:18px 0 12px;color:var(--muted);font-weight:700}
.soc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%}
.soc a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:16px;background:var(--card);border:2px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;font-size:.95rem}
.soc a:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.soc svg{width:28px;height:28px}
</style>
</head>
